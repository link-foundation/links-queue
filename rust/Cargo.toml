[package]
name = "links-queue"
version = "0.3.0"
edition = "2021"
description = "A Rust implementation of Links Queue - universal queue system using links"
readme = "README.md"
license = "Unlicense"
keywords = ["links-queue", "queue", "links", "rust"]
categories = ["development-tools"]
repository = "https://github.com/link-foundation/links-queue"
documentation = "https://github.com/link-foundation/links-queue"
rust-version = "1.70"

[lib]
name = "links_queue"
path = "src/lib.rs"

[[bin]]
name = "links-queue"
path = "src/main.rs"

[[example]]
name = "01-hello-world"
path = "examples/01-hello-world/main.rs"

[[example]]
name = "02-link-relationships"
path = "examples/02-link-relationships/main.rs"

[[example]]
name = "03-producer-consumer"
path = "examples/03-producer-consumer/main.rs"

[[example]]
name = "04-deduplication"
path = "examples/04-deduplication/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "net", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "queue_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
